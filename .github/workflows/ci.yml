name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@75c70f9d5db7117810669e0af01fd2eafdc396c6
        with:
          filters: |
            {"validation": ["**/*.go", "go.mod", "go.sum", "go.work", "go.work.sum", "cmd/**", "internal/**", "Taskfile.y*ml", ".go-version", ".tool-versions", ".github/workflows/**", ".github/actions/**"]}

  go-lint:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
          fromJSON(needs.changes.outputs.changes).validation) }}
    name: Go lint
    runs-on: ubuntu-latest
    env:
      GOOS: wasip1
      GOARCH: wasm
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/go-lint@9478f2f23f217048a86cb1916fb78b312f20afa7
        with:
          go-version-file: go.mod

  build:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
          fromJSON(needs.changes.outputs.changes).validation) }}
    runs-on: ubuntu-latest
    env:
      GOOS: wasip1
      GOARCH: wasm
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build -buildmode=c-shared -trimpath -o plugin.wasm cmd/wasm/main.go
